<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Manillen Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: één kolom op de breedte van een scoreblad; podium bovenaan, daaronder de statistieken per onderwerp, speeldagen onderaan. */
:root{
  --bg:#EDECEC; --surface:#FFFFFF; --ink:#161515; --muted:#5F5A5A; --line:#D9D5D5;
  --accent:#B3261E; --accent-ink:#FFFFFF; --soft:#F3DEDC;
  --green:#1E8559; --orange:#D98A1F; --red:#CC433C;
  --t1:light-dark(#1B1F1D,#E8EDE6); --t2:light-dark(#B3261E,#F28B82); --t-ink:light-dark(#FFFFFF,#161515);
  --p-L:light-dark(#2a78d6,#3987e5); --p-A:light-dark(#eb6834,#d95926); --p-S:light-dark(#1baf7a,#199e70); --p-Z:light-dark(#eda100,#c98500);
  --font-display:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111010; --surface:#1B1A1A; --ink:#EFEDED; --muted:#A8A2A2; --line:#332F2F;
    --accent:#F26D63; --accent-ink:#1A0B0A; --soft:#2F1D1C;
    --green:#4CC38A; --orange:#F0B35A; --red:#FF7B73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111010; --surface:#1B1A1A; --ink:#EFEDED; --muted:#A8A2A2; --line:#332F2F;
  --accent:#F26D63; --accent-ink:#1A0B0A; --soft:#2F1D1C;
  --green:#4CC38A; --orange:#F0B35A; --red:#FF7B73; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-direction:column;gap:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.pod .who{text-align:center;padding:0 2px 8px;min-width:0}
.pod .pn{font-family:var(--font-display);font-weight:700;font-size:20px;overflow-wrap:anywhere}
.pod .pm{color:var(--muted);font-size:13px}
.pod .blk{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:40px;border-radius:10px 10px 0 0;
  background:var(--soft);color:var(--accent)}
.pod.r1 .blk{height:128px;background:var(--accent);color:var(--accent-ink)}
.pod.r2 .blk{height:96px}
.pod.r3 .blk{height:72px}
.pod.r4 .blk{height:48px;font-size:30px}
.fourth{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
.fourth b{color:var(--ink);font-family:var(--font-display)}
.tbl-wrap{overflow-x:auto}
.chart{display:flex;flex-direction:column;gap:10px}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.chart-head h3{font-size:16px}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:10px;height:10px;border-radius:50%;display:inline-block}
svg.pc{display:block;max-width:100%;height:auto}
svg.pc .ax{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
svg.pc .nm{fill:var(--ink);font-size:13px;font-weight:600;font-family:var(--font-body)}
details.tv summary{cursor:pointer;color:var(--muted);font-size:13px}
details.tv .tbl-wrap{margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.lead{font-weight:600}
.note{font-size:13px;color:var(--muted)}

/* troef */
.suit{font-family:'Segoe UI Symbol','Apple Symbols',system-ui,sans-serif;font-size:1.15em}
.suit.red{color:var(--red)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(96px,150px) 1fr;gap:10px;align-items:center}
.bar-row .lab{display:flex;gap:8px;align-items:center;min-width:0;overflow-wrap:anywhere}
.track{position:relative;height:22px;border-left:1px solid var(--line)}
.fill{height:100%;border-radius:0 4px 4px 0}
.bv{position:absolute;top:50%;transform:translateY(-50%);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* spelers */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.player dl{margin:8px 0 0;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.player dt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.player dd{margin:0;text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.player .grp{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-family:var(--font-body);font-size:11px;font-weight:600;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.player .head+.grp{margin-top:12px}
.player .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}

/* tempo */
.tempo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.big{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1}
.stat-l{color:var(--muted);font-size:13px}

/* speeldagen */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.day[open]{padding-bottom:14px}
details.day>summary:hover .chev{background:var(--bg)}
.chev{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--muted);transition:transform .2s}
details.day[open]>summary .chev{transform:rotate(180deg)}
.iconbtn{position:absolute;top:8px;right:38px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
details.day>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
.day-body{padding:0;display:flex;flex-direction:column;gap:12px}
.game{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
table.blad{table-layout:fixed;border-collapse:separate;border-spacing:4px 3px;width:calc(100% + 8px);margin:0 -4px}
table.blad th,table.blad td{padding:0;border:0;border-radius:7px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
table.blad th{font-weight:400;padding:8px 4px}
table.blad th.t1{background:var(--t1);color:var(--t-ink)}
table.blad th.t2{background:var(--t2);color:var(--t-ink)}
table.blad th.win{font-weight:700}
table.blad .tn{font-size:12px;white-space:normal;line-height:1.2}
table.blad .ts{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
table.blad td{height:28px;background:var(--surface)}
table.blad td.t1{background:var(--t1);color:var(--t-ink)}
table.blad td.t2{background:var(--t2);color:var(--t-ink)}
table.blad td b{font-size:14px}
table.blad td i{font-style:normal;font-size:11px;opacity:.85;margin-left:4px}
table.blad td .dash{color:var(--muted);opacity:.6}
table.blad .tag{background:var(--bg);color:var(--ink);border:0;font-size:9px;padding:2px 4px}
table.blad .tag.pos{color:var(--green)}
table.blad .tag.neg{color:var(--red)}
.gh{display:flex;align-items:center;gap:6px;min-height:30px;flex-wrap:wrap;cursor:pointer;list-style:none}
.gh::-webkit-details-marker{display:none}
.game:has(.iconbtn) .gh .eyebrow{margin-right:34px}
.gh .eyebrow{order:1;flex:1 1 0;min-width:0}
.gchev{order:2;flex:none;color:var(--muted);transition:transform .2s}
details.game[open] .gchev{transform:rotate(180deg)}
.game>table{margin-top:10px}
.mini{order:3;flex:1 0 100%;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);margin-top:4px}
.mini b{color:var(--ink);font-family:var(--font-display);margin-left:2px}
.mini .win{color:var(--ink);font-weight:700}
details.game[open] .mini{display:none}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (min-width:1101px){.games.c1{grid-template-columns:minmax(0,420px)}.games.c2{grid-template-columns:repeat(2,minmax(0,420px))}.games.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.games.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tags2{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle}
.game .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.team{display:flex;gap:8px;align-items:baseline;min-width:0}
.team.win{font-weight:600}
.team .sc{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px 6px;padding-top:6px}
.chip{position:relative;min-width:42px;height:40px;padding:2px 4px;border-radius:7px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{font-family:var(--font-display);font-size:14px}
.chip i{font-style:normal;font-size:10px;opacity:.9}
.chip.t1{background:var(--t1);color:var(--t-ink)}
.chip.t2{background:var(--t2);color:var(--t-ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.dot.t1{background:var(--t1)}
.dot.t2{background:var(--t2)}
.chip.mul{border:2px dashed var(--ink)}
.tags{position:absolute;top:-8px;right:-5px;display:flex;gap:2px}
.tag{font-size:9px;font-weight:700;line-height:1;padding:2px 4px;border-radius:99px;background:var(--ink);color:var(--bg);border:1px solid var(--bg);white-space:nowrap;letter-spacing:.02em}
.tag.mee{background:var(--accent);color:var(--accent-ink)}
.tag.pos{background:var(--green);color:var(--t-ink)}
.tag.neg{background:var(--red);color:var(--t-ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.status{font-size:13px;color:var(--muted)}

/* editor */
#editor{position:fixed;inset:0;background:rgba(10,12,24,.55);z-index:20;display:none;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
#editor.open{display:block}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.rounds{border-collapse:collapse;table-layout:fixed;min-width:420px}
.rounds th,.rounds td{padding:2px;border:1px solid var(--line);text-align:center}
.rounds tr:last-child td{border-bottom:1px solid var(--line)}
.rounds th{font-size:11px;padding:5px 2px;letter-spacing:.04em}
.rounds th.tn{font-family:var(--font-display);font-size:14px;color:var(--t-ink);letter-spacing:0;text-transform:none}
.rounds th.tn.t1{background:var(--t1)}
.rounds th.tn.t2{background:var(--t2)}
.rounds td.rn{font-weight:700;font-size:12px;color:var(--t-ink);width:30px}
.rounds td.rn.g{background:var(--green)}
.rounds td.rn.o{background:var(--orange)}
.rounds td.rn.r{background:var(--red)}
.rounds input,.rounds select{width:100%;min-width:0;padding:6px 2px;text-align:center;text-align-last:center;border:0;border-radius:0;background:transparent;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.actions .grp{display:flex;flex-wrap:wrap;gap:8px}
.suitform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
@media (max-width:520px){
  h1{font-size:28px}
  .bar-row{grid-template-columns:100px 1fr}
  .pod .blk{font-size:32px}
  .pod .pn{font-size:16px}
  .pod .pm{font-size:12px}
}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.games{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.hm{display:none}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Leon · Arne · Siebe · Zeno</div>
      <h1>Manillen</h1>
    </div>
  </header>
  <div id="status" class="status" hidden></div>
  <div id="root"></div>
</div>
<div id="editor" aria-modal="true" role="dialog"></div>

<script>
(function(){
var PL=[{id:'L',n:'Leon'},{id:'A',n:'Arne'},{id:'S',n:'Siebe'},{id:'Z',n:'Zeno'}];
var NAME={};PL.forEach(function(p){NAME[p.id]=p.n});
var GLYPH={1:'♣︎',2:'♠︎',3:'♦︎',4:'♥︎'};
var DEFAULT_SUITS={1:'Klaveren',2:'Pijken',3:'Koeken',4:'Hartjes'};
var state={games:[],suits:Object.assign({},DEFAULT_SUITS),canEdit:false,db:null,loaded:false,error:'',ed:null,confirmDel:false};
var $root=document.getElementById('root'),$status=document.getElementById('status'),$ed=document.getElementById('editor');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function suitHtml(t){if(t==='M')return '<span class="suit" style="font-weight:700">Mul</span>';return '<span class="suit'+(t>=3?' red':'')+'">'+GLYPH[t]+'</span>'}
function toMin(s){if(!s)return null;var m=/^(\d{1,2}):(\d{2})/.exec(s);return m?(+m[1])*60+(+m[2]):null}
function dur(g){var a=toMin(g.start),b=toMin(g.end);if(a==null||b==null)return null;var d=b-a;if(d<0)d+=1440;return d}
function fmt1(x){return x==null||isNaN(x)?'–':(Math.round(x*10)/10).toString().replace('.',',')}
function fmtMin(m){if(m==null)return '–';m=Math.round(m);var h=Math.floor(m/60);return h?h+' u '+('0'+(m%60)).slice(-2)+' min':m+' min'}
function isNum(x){return typeof x==='number'&&isFinite(x)}

/* ----- berekeningen ----- */
function analyze(g){
  var pa=0,pb=0;
  return (g.rounds||[]).map(function(r,i){
    var da=isNum(r.a)&&r.a>pa?r.a-pa:0, dbb=isNum(r.b)&&r.b>pb?r.b-pb:0;
    if(isNum(r.a))pa=Math.max(pa,r.a); if(isNum(r.b))pb=Math.max(pb,r.b);
    return {i:i,ta:pa,tb:pb,t:r.t,d:r.d,m:r.m||'',r:r.r||'',s:r.s||'',da:da,db:dbb,scorer:da>0?'a':(dbb>0?'b':null),dealerTeam:(g.a||[]).indexOf(r.d)>=0?'a':'b'};
  });
}
function finals(g){
  var fa=g.finalA,fb=g.finalB;
  if(!isNum(fa)||!isNum(fb)){var pa=0,pb=0;(g.rounds||[]).forEach(function(r){if(isNum(r.a))pa=Math.max(pa,r.a);if(isNum(r.b))pb=Math.max(pb,r.b)});if(!isNum(fa))fa=pa;if(!isNum(fb))fb=pb}
  return {a:fa,b:fb,winner:fa>fb?'a':(fb>fa?'b':null)};
}
function compute(){
  var S={},suitTotals={1:0,2:0,3:0,4:0,M:0},totalRounds=0,durs=[],durRounds=0,durMinTot=0;
  PL.forEach(function(p){S[p.id]={id:p.id,played:0,won:0,pts:0,deals:0,dealPts:0,dealHit:0,trump:{1:0,2:0,3:0,4:0,M:0},mul:0,mulWin:0,mee:0,meePlus:0,meeMin:0,meeZero:0,zelf:0,maat:0,werkMaat:0,partners:{}}});
  state.games.forEach(function(g){
    var f=finals(g),rs=analyze(g);
    ['a','b'].forEach(function(side){
      (g[side]||[]).forEach(function(pid){var s=S[pid];if(!s)return;s.played++;s.pts+=f[side];if(f.winner===side)s.won++;
        (g[side]||[]).forEach(function(q){if(q===pid)return;var pp=s.partners[q]||(s.partners[q]={g:0,w:0});pp.g++;if(f.winner===side)pp.w++})});
    });
    rs.forEach(function(r){
      totalRounds++;
      var s=S[r.d];
      if(s){s.deals++;var pts=r.dealerTeam==='a'?r.da:r.db;s.dealPts+=pts;if(pts>0)s.dealHit++;
        if(r.t==='M'){s.trump.M++;s.mul++;if(pts>0)s.mulWin++}else if(r.t>=1&&r.t<=4){s.trump[r.t]++}}
      if(r.t==='M'||(r.t>=1&&r.t<=4))suitTotals[r.t]++;
      var m=S[r.m];
      if(m){m.mee++;if(r.r==='+')m.meePlus++;else if(r.r==='-')m.meeMin++;else if(r.r==='0')m.meeZero++;if(r.s==='zelf')m.zelf++;else if(r.s==='maat'){m.maat++;var team=(g.a||[]).indexOf(r.m)>=0?g.a:g.b;var pt=(team||[]).filter(function(x){return x!==r.m})[0];if(S[pt])S[pt].werkMaat++}}
    });
    var d=dur(g);if(d!=null){durs.push({g:g,d:d,n:rs.length});durMinTot+=d;durRounds+=rs.length}
  });
  var rank=PL.map(function(p){return S[p.id]}).sort(function(x,y){return y.won-x.won||y.pts-x.pts||x.id.localeCompare(y.id)});
  return {S:S,rank:rank,suitTotals:suitTotals,totalRounds:totalRounds,durs:durs,durMinTot:durMinTot,durRounds:durRounds};
}

/* ----- weergave ----- */
function podium(c){
  var r=c.rank;
  function pod(p,pos){return '<div class="pod r'+pos+'"><div class="who"><div class="pn">'+esc(NAME[p.id])+'</div><div class="pm num">'+p.won+' ~ '+p.pts+' ptn</div></div><div class="blk">'+pos+'</div></div>'}
  var h='<div class="podium">'+pod(r[1],2)+pod(r[0],1)+pod(r[2],3)+pod(r[3],4)+'</div>';
  h+=posChart();
  return h;
}
function standingsByDate(){
  var dates=[];
  state.games.forEach(function(g){if(g.date&&dates.indexOf(g.date)<0)dates.push(g.date)});
  dates.sort();
  return dates.map(function(dt){
    var S={};PL.forEach(function(p){S[p.id]={id:p.id,won:0,pts:0}});
    state.games.forEach(function(g){
      if(!g.date||g.date>dt)return;
      var f=finals(g);
      ['a','b'].forEach(function(side){(g[side]||[]).forEach(function(pid){var s=S[pid];if(!s)return;s.pts+=f[side];if(f.winner===side)s.won++})});
    });
    var order=PL.map(function(p){return S[p.id]}).sort(function(x,y){return y.won-x.won||y.pts-x.pts||x.id.localeCompare(y.id)});
    var pos={};order.forEach(function(s,i){pos[s.id]=i+1});
    return {date:dt,pos:pos,S:S,order:order};
  });
}
function shortDate(dt){var d=new Date(dt+'T12:00:00');return isNaN(d)?dt:d.toLocaleDateString('nl-BE',{day:'numeric',month:'short'})}
function posChart(){
  var H=standingsByDate();
  if(!H.length)return '';
  var W=Math.max(280,Math.min(1148,($root.clientWidth||720)-34));
  var padL=28,padR=W<520?62:90,padT=16,padB=30,step=40;
  var Ht=padT+padB+3*step,n=H.length;
  function x(i){return (n===1?(padL+W-padR)/2:padL+(W-padL-padR)*i/(n-1)).toFixed(1)}
  function y(p){return padT+(p-1)*step}
  var s='<svg class="pc" role="img" aria-label="Plaats van elke speler per speeldag" viewBox="0 0 '+W+' '+Ht+'" width="'+W+'" height="'+Ht+'">';
  for(var p=1;p<=4;p++){
    s+='<line x1="'+padL+'" x2="'+(W-padR+6)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text class="ax" x="'+(padL-10)+'" y="'+(y(p)+4)+'" text-anchor="end">'+p+'</text>';
  }
  var skip=Math.ceil(n/Math.max(1,Math.floor((W-padL-padR)/70)));
  H.forEach(function(h,i){if(i%skip===0)s+='<text class="ax" x="'+x(i)+'" y="'+(Ht-8)+'" text-anchor="middle">'+esc(shortDate(h.date))+'</text>'});
  PL.forEach(function(pl){
    var col='var(--p-'+pl.id+')';
    if(n>1){
      var d=H.map(function(h,i){return (i?'L':'M')+x(i)+' '+y(h.pos[pl.id])}).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
  });
  PL.forEach(function(pl){
    var col='var(--p-'+pl.id+')';
    H.forEach(function(h,i){
      var st=h.S[pl.id],tip=pl.n+' · '+shortDate(h.date)+' · plaats '+h.pos[pl.id]+' · '+st.won+(st.won===1?' boom':' bomen')+' · '+st.pts+' ptn';
      s+='<circle cx="'+x(i)+'" cy="'+y(h.pos[pl.id])+'" r="5" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';
      s+='<circle cx="'+x(i)+'" cy="'+y(h.pos[pl.id])+'" r="14" fill="transparent"><title>'+esc(tip)+'</title></circle>';
    });
    var last=H[n-1];
    s+='<text class="nm" x="'+(+x(n-1)+12)+'" y="'+(y(last.pos[pl.id])+4)+'">'+esc(pl.n)+'</text>';
  });
  s+='</svg>';
  var lastOrder=H[n-1].order;
  var leg='<div class="legend2">'+lastOrder.map(function(o){return '<span><i style="background:var(--p-'+o.id+')"></i>'+esc(NAME[o.id])+'</span>'}).join('')+'</div>';
  return '<div class="card chart"><div class="chart-head"><h3>Plaats per speeldag</h3>'+leg+'</div>'+s+'</div>';
}
function troefSection(c){
  var tot=0;[1,2,3,4,'M'].forEach(function(k){tot+=c.suitTotals[k]});
  var max=Math.max.apply(null,[1,2,3,4,'M'].map(function(k){return c.suitTotals[k]}).concat([1]));
  var bars=[1,2,3,4,'M'].map(function(k){
    var v=c.suitTotals[k],pct=tot?Math.round(v/tot*100):0;
    var lab=k==='M'?'<span class="suit" style="font-weight:700">Mul</span>':suitHtml(k)+' '+esc(state.suits[k]);
    var col=k==='M'?'var(--muted)':(k<=2?'var(--t1)':'var(--t2)'),w=(v/max*88).toFixed(1);
    return '<div class="bar-row"><div class="lab">'+lab+'</div><div class="track"><div class="fill" style="width:'+w+'%;background:'+col+'"></div><span class="bv" style="left:calc('+w+'% + 8px)">'+v+'</span></div></div>';
  }).join('');
  var head='<tr><th>Speler</th>'+[1,2,3,4].map(function(k){return '<th>'+suitHtml(k)+'</th>'}).join('')+'<th>Mul</th><th>Delen</th></tr>';
  var body=PL.map(function(p){var s=c.S[p.id];return '<tr><td class="lead">'+esc(p.n)+'</td>'+[1,2,3,4].map(function(k){return '<td>'+s.trump[k]+'</td>'}).join('')+'<td>'+s.trump.M+'</td><td>'+s.deals+'</td></tr>'}).join('');
  return '<div class="card bars">'+bars+'</div><div class="card tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
function bestPartner(s){
  var best=null;Object.keys(s.partners).forEach(function(q){var p=s.partners[q];var rate=p.w/p.g;
    if(!best||rate>best.rate||(rate===best.rate&&p.g>best.g))best={q:q,w:p.w,g:p.g,rate:rate}});
  return best;
}
function spelers(c){
  return '<div class="grid">'+c.rank.map(function(s,i){
    var bp=bestPartner(s);
    var avgDeal=s.deals?s.dealPts/s.deals:null,hit=s.deals?Math.round(s.dealHit/s.deals*100):null;
    var win=s.played?Math.round(s.won/s.played*100):null;
    return '<div class="card player"><div class="head"><h3>'+esc(NAME[s.id])+'</h3><span class="badge">#'+(i+1)+'</span></div><h4 class="grp">Totalen</h4><dl>'
    +'<dt>Bomen gewonnen</dt><dd>'+s.won+' van '+s.played+(win!=null?' ('+win+'%)':'')+'</dd>'
    +'<dt>Punten totaal</dt><dd>'+s.pts+'</dd>'
    +'</dl><h4 class="grp">Gemiddeldes</h4><dl><dt>Gem. punten per boom</dt><dd>'+fmt1(s.played?s.pts/s.played:null)+'</dd>'
    +'<dt>Gem. op eigen deel</dt><dd>'+fmt1(avgDeal)+' ptn</dd>'
    +'<dt>Punten op eigen deel</dt><dd>'+(hit==null?'–':hit+'%')+' ('+s.dealHit+'/'+s.deals+')</dd>'
    +'</dl><h4 class="grp">Mul en meegaan</h4><dl><dt>Op de mul</dt><dd>'+s.mul+'×'+(s.mul?' (+'+s.mulWin+' / −'+(s.mul-s.mulWin)+')':'')+'</dd>'
    +'<dt>Meegegaan</dt><dd>'+s.mee+'×'+(s.mee?' (+'+s.meePlus+' / −'+s.meeMin+(s.meeZero?' / 0:'+s.meeZero:'')+')':'')+'</dd>'
    +'<dt>Mee, zelf het werk</dt><dd>'+s.zelf+'×</dd>'
    +'<dt>Mee, maat het werk</dt><dd>'+s.maat+'×</dd>'
    +'<dt>Werk voor maat</dt><dd>'+s.werkMaat+'×</dd>'
    +'</dl><h4 class="grp">Samen</h4><dl><dt>Beste maat</dt><dd>'+(bp?esc(NAME[bp.q])+' ('+bp.w+'/'+bp.g+')':'–')+'</dd>'
    +'</dl></div>';
  }).join('')+'</div>';
}
function tempo(c){
  var n=c.durs.length;
  if(!n)return '<div class="empty">Nog geen begin- en einduur ingevuld.</div>';
  var avg=c.durMinTot/n,per=c.durRounds?c.durMinTot/c.durRounds:null;
  var sorted=c.durs.slice().sort(function(x,y){return x.d-y.d});
  var fast=sorted[0],slow=sorted[n-1];
  function lab(x){return fmtMin(x.d)+' · '+x.n+' delen'}
  return '<div class="tempo">'
   +'<div class="card"><div class="big num">'+fmtMin(c.durMinTot)+'</div><div class="stat-l">totaal gespeeld</div></div>'
   +'<div class="card"><div class="big num">'+fmtMin(avg)+'</div><div class="stat-l">gemiddeld per boom</div></div>'
   +'<div class="card"><div class="big num">'+fmt1(per)+' min</div><div class="stat-l">gemiddeld per deel</div></div>'
   +'<div class="card"><div class="big num">'+fmtMin(fast.d)+'</div><div class="stat-l">snelste boom · '+fast.n+' delen</div></div>'
   +'<div class="card"><div class="big num">'+fmtMin(slow.d)+'</div><div class="stat-l">langste boom · '+slow.n+' delen</div></div>'
   +'</div>';
}
function sheetRows(g){
  var rs=analyze(g);
  return rs.map(function(r){
    var cells=['a','b'].map(function(side){
      var scored=r.scorer===side,tags='';
      if(r.t==='M'&&r.dealerTeam===side)tags+='<span class="tag">MUL</span>';
      if(r.m){
        var ms=(g.a||[]).indexOf(r.m)>=0?'a':'b';
        if(ms===side){var rc=r.r==='+'?' pos':(r.r==='-'?' neg':'');tags+='<span class="tag mee'+rc+'">'+esc(r.m)+(r.r==='+'?'+':(r.r==='-'?'−':(r.r==='0'?'0':'')))+'</span>'}
      }
      var tot=side==='a'?r.ta:r.tb,dl=side==='a'?r.da:r.db;
      var cls=scored?(side==='a'?'t1':'t2'):'none';
      return '<td class="'+cls+'">'+(scored?'<b>'+tot+'</b><i>+'+dl+'</i>':'<span class="dash">–</span>')+(tags?'<span class="tags2">'+tags+'</span>':'')+'</td>';
    }).join('');
    var who=r.scorer?(r.scorer==='a'?(g.a||[]).map(function(x){return NAME[x]}).join('+'):(g.b||[]).map(function(x){return NAME[x]}).join('+'))+' scoort':'niemand scoort';
    var ttl='Deel '+(r.i+1)+' · deler '+NAME[r.d]+' · '+who+(r.m?' · '+NAME[r.m]+' gaat mee':'')+' · troef '+(r.t==='M'?'mul':(state.suits[r.t]||'?'));
    return '<tr title="'+esc(ttl)+'">'+cells+'</tr>';
  }).join('');
}

  var f=finals(g),d=dur(g);
  var an=(g.a||[]).map(function(x){return NAME[x]}).join(' + '),bn=(g.b||[]).map(function(x){return NAME[x]}).join(' + ');

   +'<th class="t2'+(f.winner==='b'?' win':'')+'"><div class="tn">'+esc(bn)+'</div><div class="ts">'+f.b+'</div></th></tr></thead>'
   +'<tbody>'+sheetRows(g)+'</tbody></table></details>';

function dayLabel(date){
  var d=new Date(date+'T12:00:00');if(isNaN(d))return esc(date);
  return d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function dagen(){
  var by={};state.games.forEach(function(g){(by[g.date||'onbekend']=by[g.date||'onbekend']||[]).push(g)});
  var dates=Object.keys(by).sort().reverse();
  if(!dates.length)return '<div class="empty">Nog geen bomen.</div>';
  return dates.map(function(dt,di){
    var gs=by[dt].slice().sort(function(a,b){return (a.start||'')<(b.start||'')?-1:1});
    var w={};PL.forEach(function(p){w[p.id]=0});
    gs.forEach(function(g){var f=finals(g);if(f.winner)(g[f.winner]||[]).forEach(function(p){if(w[p]!=null)w[p]++})});
    var sum=PL.slice().sort(function(a,b){return w[b.id]-w[a.id]}).map(function(p){return esc(p.n)+' '+w[p.id]}).join(' · ');
    return '<details class="day" data-key="d:'+esc(dt)+'"'+(OPEN['d:'+dt]?' open':'')+'><summary><span><b style="font-family:var(--font-display);text-transform:capitalize">'+dayLabel(dt)+'</b><br><span class="note">'+gs.length+' '+(gs.length===1?'boom':'bomen')+' · gewonnen: '+sum+'</span></span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></summary>'
     +'<div class="day-body"><div class="games c'+(gs.length<=3?gs.length:(gs.length<=6&&gs.length!==4?3:4))+'">'+gs.map(function(g,i){return gameHtml(g,i)}).join('')+'</div>'
     +'</div></details>';
  }).join('');
}
